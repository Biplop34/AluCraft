<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Price List</title>
    <style>
    :root {
      color-scheme: light;
      --pl-bg: #f5f7fa;
      --pl-surface: #ffffff;
      --pl-text: #172033;
      --pl-muted: #667388;
      --pl-border: #9ba5b3;
      --pl-soft-border: #dce2e9;
      --pl-head: #e9edf2;
      --pl-row-alt: #f7f8fa;
      --pl-accent: #3f9188;
      --pl-accent-text: #ffffff;
    }
    html.dark {
      color-scheme: dark;
      --pl-bg: #151b26;
      --pl-surface: #202a39;
      --pl-text: #f1f5f9;
      --pl-muted: #b2bfd0;
      --pl-border: #6b7788;
      --pl-soft-border: #39475a;
      --pl-head: #2c394b;
      --pl-row-alt: #242f3e;
      --pl-accent: #56b4a8;
      --pl-accent-text: #102a28;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: var(--pl-bg);
      color: var(--pl-text);
      font: 500 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .page { min-height: 100%; padding: 18px clamp(8px, 3vw, 32px) 30px; }
    .content { width: 100%; max-width: 1200px; margin: 0 auto; }
    .profile-switch { display: flex; gap: 4px; width: 100%; max-width: 440px; margin: 0 auto 16px; padding: 4px; border: 1px solid var(--pl-soft-border); border-radius: 14px; background: var(--pl-head); }
    .profile-tab { flex: 1; min-height: 42px; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--pl-muted); font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .profile-tab[aria-pressed="true"] { background: var(--pl-accent); color: var(--pl-accent-text); box-shadow: 0 1px 3px #0002; }
    .updated-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .updated { color: var(--pl-muted); white-space: nowrap; }
    .makers { margin: 0 0 13px; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .045em; }
    .table-wrap {
      overflow-x: hidden;
      background: var(--pl-surface); border: 1px solid var(--pl-border);
    }
    table { border-collapse: collapse; width: 100%; min-width: 0; table-layout: fixed; font-size: 12px; font-variant-numeric: tabular-nums; }
    th, td { border: 1px solid var(--pl-border); padding: 7px 5px; overflow-wrap: anywhere; }
    thead th { background: var(--pl-head); font-weight: 800; text-align: center; }
    .golden-header { white-space: nowrap; overflow-wrap: normal; word-break: keep-all; }
    th:first-child, td:first-child { width: 32%; text-align: left; }
    th:nth-child(2), td:nth-child(2) { width: 8%; text-align: center; }
    th:nth-child(n+3), td:nth-child(n+3) { width: 15%; }
    td:nth-child(n+3) { text-align: right; white-space: nowrap; letter-spacing: -.02em; }
    tbody tr.data-row:nth-child(even) { background: var(--pl-row-alt); }
    .section-row td { background: var(--pl-head); text-align: center !important; font-weight: 800; }
    @media (max-width: 560px) {
      .page { padding: 15px 8px 24px; }
      .updated { font-size: 11px; }
      .makers { font-size: 11px; line-height: 1.35; }
      th:first-child, td:first-child { width: 25%; }
      th:nth-child(2), td:nth-child(2) { width: 9%; }
      th:nth-child(n+3), td:nth-child(n+3) { width: 16.5%; }
      .golden-header { font-size: 8px; }
      table { font-size: 10.5px; }
      th, td { padding: 5px 3px; }
    }
    @media (max-width: 360px) {
      table { font-size: 10px; }
      th, td { padding: 4px 2px; }
    }
  </style>
</head>
<body>

    <section class="content" aria-label="Aluminium profile price list">
      <div class="profile-switch" role="group" aria-label="Profile type">
        <button id="high-profile-tab" class="profile-tab" type="button" aria-pressed="true">High Profile</button>
        <button id="low-profile-tab" class="profile-tab" type="button" aria-pressed="false">Low Profile</button>
      </div>

      </div>

      <div class="table-wrap" role="region" aria-label="Price list table" tabindex="0">

          </thead>
          <tbody id="price-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
