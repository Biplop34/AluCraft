    <title>AluCraft</title>
    
    <script>
      try {
        const t = localStorage.getItem("app_theme") || "light";
        const isDark = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");

        // Clear active unsubmitted calculator so app always opens with clean blank input fields
        localStorage.removeItem("thai_active_calculator");
        localStorage.removeItem("thai_pending_restore_calculator");
        localStorage.removeItem("thai_billing_square_feet_amount");
        localStorage.removeItem("thai_billing_fanlight_amount");

        if (window.AndroidBridge && typeof window.AndroidBridge.getAppData === "function") {
          const natCust = window.AndroidBridge.getAppData("thai_customers_db");
          const localCust = localStorage.getItem("thai_customers_db");
          if (natCust && natCust.length > 5 && (!localCust || localCust === "[]" || localCust.length < natCust.length)) {
            localStorage.setItem("thai_customers_db", natCust);
          }
          const natHist = window.AndroidBridge.getAppData("thai_history");
          const localHist = localStorage.getItem("thai_history");
          if (natHist && natHist.length > 5 && (!localHist || localHist === "[]" || localHist.length < natHist.length)) {
            localStorage.setItem("thai_history", natHist);
          }
          const natBilling = window.AndroidBridge.getAppData("thai_billing_records");
          const localBilling = localStorage.getItem("thai_billing_records");
          if (natBilling && natBilling.length > 2 && (!localBilling || localBilling === "{}" || localBilling.length < natBilling.length)) {
            localStorage.setItem("thai_billing_records", natBilling);
          }
        }
      } catch(e) {}
    </script>
