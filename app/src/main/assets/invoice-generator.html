<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<title>Invoice Generator</title>
<script>
(()=>{
  const applyAppTheme=()=>{
    try{
      const mode=localStorage.getItem("app_theme")||"light";
      const dark=mode==="dark"||(mode==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark",!!dark);
      document.documentElement.dataset.appTheme=mode;
    }catch(_){document.documentElement.classList.remove("dark");}
  };
  applyAppTheme();
  window.addEventListener("storage",applyAppTheme);
  if(window.matchMedia){
    const systemTheme=window.matchMedia("(prefers-color-scheme: dark)");
    const updateSystemTheme=()=>{try{if(localStorage.getItem("app_theme")==="system")applyAppTheme();}catch(_){}};
    if(systemTheme.addEventListener)systemTheme.addEventListener("change",updateSystemTheme);
    else if(systemTheme.addListener)systemTheme.addListener(updateSystemTheme);
  }
})();
</script>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#0f172a;background:#f8fafc;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:#0f172a}
button,input,textarea{font:inherit}
input,textarea{pointer-events:auto!important;-webkit-user-select:text!important;user-select:text!important}
input[type="number"]{appearance:textfield!important;-moz-appearance:textfield!important}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none!important;appearance:none!important;display:none!important;margin:0!important}
button{cursor:pointer}
#app{min-height:100%;padding:16px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.02em}
.sub{font-size:12px;color:#64748b;margin:4px 0 0}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;box-shadow:0 5px 16px rgba(15,23,42,.045)}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.step{font-size:10px;color:#0f766e;font-weight:900;text-transform:uppercase;letter-spacing:.14em}
.title{font-size:17px;font-weight:900;margin:5px 0 0}
.help{font-size:12px;color:#64748b;margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#64748b}
.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;color:#111827;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:#0f9688;background:#fff;box-shadow:0 0 0 3px rgba(15,150,136,.1)}
.field textarea{resize:vertical;min-height:76px}
#itemDescription{overflow-wrap:anywhere;word-break:break-word}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.actions{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px}.share-format-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.share-format-actions .btn{width:100%;min-height:46px}.share-format-actions .btn:last-child{grid-column:1/-1}
.btn{border:1px solid #d5dfe2;border-radius:12px;padding:11px 14px;background:#fff;color:#334155;font-size:12px;font-weight:850}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#147d72;border-color:#147d72;color:#fff}
.btn.light{background:#eef7f5;border-color:#d8eeea;color:#125f57}
.btn.danger{color:#b91c1c;background:#fff7f7;border-color:#fecaca}.invoice-delete-icon{width:42px;height:42px;min-width:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px}.invoice-delete-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.big{width:100%;padding:15px;font-size:14px}
.btn.icon{padding:8px 11px}
.lang-grid,.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
.choice{min-height:86px;text-align:left;border:1px solid #dce5e7;background:#fff;border-radius:16px;padding:16px;color:#1e293b}
.choice.selected,.choice:hover{border-color:#147d72;background:#effaf7}
.choice strong{display:block;font-size:14px}
.choice small{display:block;color:#64748b;font-size:11px;margin-top:5px}
.item-count{background:#f1f5f9;border-radius:999px;padding:6px 10px;color:#475569;font-size:10px;font-weight:900;white-space:nowrap}
.calculated{display:flex;justify-content:space-between;align-items:center;background:#effaf7;border:1px solid #d2eee8;padding:12px 13px;border-radius:12px;margin-top:14px;font-size:12px;font-weight:800}
.total{font-variant-numeric:tabular-nums}
.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding-top:14px;border-top:1px solid #f1f5f9;margin-top:16px}
.toolbar .btn{padding:10px 5px;font-size:10px}
.invoice-list{display:flex;flex-direction:column;gap:10px}
.invoice-card{width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:15px;box-shadow:0 4px 12px rgba(15,23,42,.035)}
.invoice-card:active{transform:scale(.99)}
.invoice-card-title{font-size:13px;font-weight:900;color:#0f172a}
.invoice-card-sub{font-size:11px;color:#64748b;margin-top:4px}
.invoice-card-bottom{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #f1f5f9;margin-top:11px;padding-top:9px;font-size:10px;color:#94a3b8;font-weight:750}
.amount{font-size:14px;color:#0f766e;font-weight:900}
.empty{text-align:center;padding:42px 16px;border:1px dashed #cbd5e1;border-radius:20px;background:#fff}
.empty .icon{font-size:34px}
.empty h3{font-size:14px;margin:9px 0 4px}
.empty p{font-size:12px;color:#94a3b8;margin:0}
.sheet-wrap{width:100%;overflow:auto;padding:1px 0}
.sheet-preview{background:#fff;border:1px solid #dbe2e4;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.08);width:100%;max-width:794px;margin:auto;display:block}
.preview-page-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;color:#64748b;font-size:11px;font-weight:800}
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.62);padding:16px}
.modal{width:min(100%,460px);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:19px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal h3{font-size:16px;margin:0;font-weight:900}
.toast{position:fixed;z-index:500;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:999px;padding:11px 18px;font-size:12px;font-weight:850;box-shadow:0 10px 25px #0003}
.small{font-size:10px;color:#64748b}
@media(max-width:520px){#app{padding:13px}.panel{padding:15px}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .btn{font-size:11px}.lang-grid,.choice-grid{gap:8px}}
@media print{body{background:#fff}#app{padding:0}.no-print{display:none!important}.print-only{display:block!important}}
.print-only{display:none}
body,#app,#app *{text-transform:capitalize!important}input::placeholder,textarea::placeholder{text-transform:capitalize!important}</style>
<style>
html.dark{color-scheme:dark;background:#0f172a;color:#f8fafc}
html.dark body,html.dark #app{background:#0f172a;color:#f8fafc}
html.dark .panel,html.dark .invoice-card,html.dark .empty,html.dark .modal{background:#1e293b;color:#f8fafc;border-color:#334155;box-shadow:0 5px 18px rgba(0,0,0,.22)}
html.dark .sub,html.dark .help,html.dark .small,html.dark .invoice-card-sub,html.dark .invoice-card-bottom,html.dark .preview-page-nav{color:#94a3b8}
html.dark .step,html.dark .field label{color:#cbd5e1}
html.dark .field input,html.dark .field textarea{background:#0f172a;color:#f8fafc;border-color:#475569}
html.dark .field input::placeholder,html.dark .field textarea::placeholder{color:#94a3b8}
html.dark .field input:focus,html.dark .field textarea:focus{background:#111f33;border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.14)}
html.dark .btn{background:#1e293b;color:#e2e8f0;border-color:#475569}
html.dark .btn.primary{background:#147d72;color:#fff;border-color:#147d72}
html.dark .btn.light{background:#123c3a;color:#99f6e4;border-color:#1b5b56}
html.dark .btn.danger{background:#3b2028;color:#fecaca;border-color:#71313d}
html.dark .choice{background:#0f172a;color:#f8fafc;border-color:#475569}
html.dark .choice small{color:#94a3b8}
html.dark .choice.selected,html.dark .choice:hover{background:#123c3a;border-color:#2dd4bf}
html.dark .item-count{background:#334155;color:#cbd5e1}
html.dark .calculated{background:#123c3a;color:#ccfbf1;border-color:#1b5b56}
html.dark .toolbar{border-color:#334155}
html.dark .invoice-card-title,html.dark .title,html.dark .modal h3{color:#f8fafc}
html.dark .invoice-card-bottom{border-color:#334155}
html.dark .amount{color:#5eead4}
html.dark .empty{border-style:dashed}
html.dark .sheet-preview{background:#fff;border-color:#475569;box-shadow:0 8px 24px rgba(0,0,0,.35)}
html.dark .overlay{background:rgba(2,6,23,.78)}
html.dark .toast{background:#020617;color:#f8fafc;box-shadow:0 10px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
"use strict";
const DEFAULT_SHOP={name:"",address:"",phone1:"",phone2:"",logoDataUrl:""};
const STORAGE_INVOICES="invoice_generator_records",STORAGE_SHOP="invoice_shop_profile";
const app=document.getElementById("app");
const state={mode:"list",invoices:readStored(STORAGE_INVOICES,[]),shop:Object.assign({},DEFAULT_SHOP,readStored(STORAGE_SHOP,{})),shopDraft:null,customer:{name:"",address:"",phone:""},language:"en",items:[{description:"",quantity:"1",rate:""}],active:0,invoiceNo:"",signatureMode:"auto",selected:null,shareOpen:false,previewPage:0,images:[],imageKey:"",busy:false};
function readStored(key,fallback){try{let raw=localStorage.getItem(key)||"";if(!raw&&window.AndroidBridge&&typeof AndroidBridge.getAppData==="function")raw=AndroidBridge.getAppData(key)||"";const parsed=JSON.parse(raw||"null");return parsed==null?fallback:parsed;}catch(e){return fallback;}}
function writeStored(key,value){const json=JSON.stringify(value);localStorage.setItem(key,json);if(window.AndroidBridge&&typeof AndroidBridge.saveAppData==="function")AndroidBridge.saveAppData(key,json);}
function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function labels(){return state.language==="bn"?{customer:"গ্রাহকের তথ্য",name:"গ্রাহকের নাম",address:"গ্রাহকের ঠিকানা",phone:"ফোন নম্বর",chooseLanguage:"Invoice-এর ভাষা নির্বাচন করুন",description:"বিবরণ",quantity:"পরিমাণ",rate:"দর",total:"মোট",grandTotal:"সর্বমোট",signature:"অনুমোদিত স্বাক্ষর",continue:"পরবর্তী",back:"পেছনে",cancel:"বাতিল",newInvoice:"নতুন Invoice",saveInvoice:"Invoice সংরক্ষণ করুন",items:"আইটেম",descriptionRequired:"প্রতিটি আইটেমের বিবরণ লিখুন।",quantityRequired:"সঠিক পরিমাণ লিখুন।",rateRequired:"সঠিক দর লিখুন।"}:{customer:"Customer Details",name:"Customer Name",address:"Customer Address",phone:"Customer Phone (Optional)",chooseLanguage:"Choose invoice language",description:"Description",quantity:"Quantity",rate:"Rate",total:"Total",grandTotal:"Grand Total",signature:"Authorized Signature",continue:"Continue",back:"Back",cancel:"Cancel",newInvoice:"New Invoice",saveInvoice:"Save Invoice",items:"items",descriptionRequired:"Enter a description for every item.",quantityRequired:"Enter a valid quantity.",rateRequired:"Enter a valid rate."};}
function money(value){const n=Math.round((Number(value)||0)*100)/100;return "৳"+n.toLocaleString("en-US",{maximumFractionDigits:2});}
function dateText(value,lang){try{return new Date(value||Date.now()).toLocaleDateString(lang==="bn"?"bn-BD":"en-GB",{day:"2-digit",month:"long",year:"numeric"});}catch(e){return "";}}
function invoiceCreatedTime(invoice){const value=invoice&&(invoice.createdAt||invoice.timestamp);const numeric=Number(value);if(Number.isFinite(numeric)&&numeric>0)return numeric;const parsed=Date.parse(String(value||""));return Number.isFinite(parsed)?parsed:0;}
function toast(message){if(window.AndroidBridge&&typeof AndroidBridge.showToast==="function"){try{AndroidBridge.showToast(message);return;}catch(e){}}const old=document.querySelector(".toast");if(old)old.remove();const node=document.createElement("div");node.className="toast";node.textContent=message;document.body.appendChild(node);setTimeout(()=>node.remove(),2400);}
function showInvoicePageToast(message){if(typeof window.showAluCraftToast==="function"){window.showAluCraftToast(message);return;}const old=document.querySelector(".toast");if(old)old.remove();const node=document.createElement("div");node.className="toast";node.setAttribute("role","status");node.textContent=message;document.body.appendChild(node);setTimeout(()=>node.remove(),2600);}
function button(text,action,klass,disabled){return '<button type="button" class="btn '+(klass||"")+'" data-action="'+action+'" '+(disabled?"disabled":"")+'>'+text+'</button>';}

function hasRequiredShopDetails(shop){const value=shop||state.shop||{};return !!(String(value.name||"").trim()&&String(value.address||"").trim()&&(String(value.phone1||"").trim()||String(value.phone2||"").trim()));}
function requireShopDetails(){if(hasRequiredShopDetails())return true;alert("Add Shop Data First");state.shopDraft=Object.assign({},DEFAULT_SHOP,state.shop||{});render();return false;}function startInvoice(){const d=new Date();const day=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("");const serial=state.invoices.filter(x=>String(x.invoiceNo||"").indexOf(day)>=0).length+1;state.invoiceNo="KT-"+day+"-"+String(serial).padStart(3,"0");state.customer={name:"",address:"",phone:""};state.language="en";state.items=[{description:"",quantity:"1",rate:""}];state.active=0;state.signatureMode="auto";state.selected=null;state.images=[];setMode("customer");}
function currentDraft(){return{id:"draft",invoiceNo:state.invoiceNo,createdAt:Date.now(),shop:Object.assign({},state.shop),customer:Object.assign({},state.customer),language:state.language,items:state.items.map(x=>({description:String(x.description||"").trim(),quantity:Number(x.quantity)||0,rate:Number(x.rate)||0})),signatureMode:state.signatureMode};}
function pagesFor(invoice){const pages=[];for(let i=0;i<invoice.items.length;i+=8)pages.push(invoice.items.slice(i,i+8));return pages.length?pages:[[]];}
function renderList(){const l=labels();const sortedInvoices=state.invoices.map(function(invoice,index){return{invoice:invoice,index:index};}).sort(function(a,b){return invoiceCreatedTime(b.invoice)-invoiceCreatedTime(a.invoice);});return '<div class="wrap"><div class="top"><div><h1>Invoices</h1><p class="sub">Create and manage customer invoices</p></div>'+button("Shop Details","shop","")+ '</div>'+button("＋ &nbsp; New Invoice","new","primary big")+(sortedInvoices.length?'<div class="invoice-list">'+sortedInvoices.map(function(entry){const inv=entry.invoice,index=entry.index;return '<button type="button" class="invoice-card" data-open="'+index+'"><div class="row"><div><div class="invoice-card-title">'+esc(inv.customer&&inv.customer.name||"Customer")+'</div><div class="invoice-card-sub">'+esc(inv.invoiceNo)+'</div></div><strong class="amount">'+money(inv.total)+'</strong></div><div class="invoice-card-bottom"><span>'+dateText(inv.createdAt,inv.language)+'</span><span>'+(inv.items||[]).length+" "+(inv.language==="bn"?"আইটেম":"items")+'</span></div></button>';}).join("")+'</div>':'<div class="empty"><div class="icon">🧾</div><h3>No invoices yet</h3><p>Generated invoices will appear here.</p></div>')+'</div>';}
function renderCustomer(){const l=labels();return '<div class="wrap"><section class="panel"><div class="panel-head"><div><div class="step">Step 1 of 4</div><h2 class="title">Customer Details</h2></div></div><div class="field"><label>'+l.name+'</label><input id="custName" type="text" value="'+esc(state.customer.name)+'" placeholder="Enter customer name"></div><div class="field"><label>'+l.address+'</label><textarea id="custAddress" placeholder="Enter customer address">'+esc(state.customer.address)+'</textarea></div><div class="field"><label>'+l.phone+'</label><input id="custPhone" type="tel" value="'+esc(state.customer.phone)+'" placeholder="Enter phone number"></div><div class="actions">'+button("Cancel","cancel","")+'<button class="btn primary" data-action="customer-next">Continue</button></div></section></div>';}
function renderLanguage(){return '<div class="wrap"><section class="panel"><div class="step">Step 2 of 4</div><h2 class="title">'+labels().chooseLanguage+'</h2><div class="lang-grid"><button type="button" class="choice '+(state.language==="en"?"selected":"")+'" data-lang="en"><strong>English</strong><small>Generate invoice in English</small></button><button type="button" class="choice '+(state.language==="bn"?"selected":"")+'" data-lang="bn"><strong>বাংলা</strong><small>বাংলায় Invoice তৈরি করুন</small></button></div><div class="actions">'+button("Back","customer-back","")+'<button type="button" class="btn primary" data-action="language-next">Continue</button></div></section></div>';}
function renderItems(){const l=labels();const item=state.items[state.active]||{description:"",quantity:"1",rate:""};const amount=(Number(item.quantity)||0)*(Number(item.rate)||0);return '<div class="wrap"><section class="panel"><div class="panel-head"><div><div class="step">Step 3 of 4</div><h2 class="title">'+(state.language==="bn"?"Invoice-এর পণ্য/সেবার তথ্য":"Invoice Items")+'</h2></div><span class="item-count">'+(state.active+1)+" / "+state.items.length+'</span></div><div class="field"><label>'+l.description+'</label><textarea id="itemDescription" maxlength="160" placeholder="'+(state.language==="bn"?"বিবরণ লিখুন":"Enter description")+'">'+esc(item.description)+'</textarea></div><div class="lang-grid"><div class="field" style="margin:0"><label>'+l.quantity+'</label><input id="itemQuantity" type="number" inputmode="decimal" min="0.01" step="any" value="'+esc(item.quantity)+'" placeholder="1"></div><div class="field" style="margin:0"><label>'+l.rate+'</label><input id="itemRate" type="number" inputmode="decimal" min="0" step="any" value="'+esc(item.rate)+'" placeholder="0"></div></div><div class="calculated"><span>'+l.total+'</span><span id="itemTotal" class="total">'+money(amount)+'</span></div><div class="toolbar">'+button("← Previous","item-prev","",state.active===0)+button("＋ Add More","item-add","light")+button("Next →","item-next","",state.active===state.items.length-1)+button("Finish","item-finish","primary")+'</div><div class="actions" style="margin-top:10px"><button class="btn" data-action="language-back">← Language</button></div></section></div>';}
function renderSignature(){return '<div class="wrap"><section class="panel"><div class="step">Step 4 of 4</div><h2 class="title">Choose Invoice Signature</h2><p class="help">Select how you want the generated invoice signed.</p><div class="choice-grid"><button class="choice" data-signature="manual"><strong>✍️ Manual Signature</strong><small>Include an authorized signature line.</small></button><button class="choice" data-signature="auto"><strong>💻 No Signature</strong><small>Include the computer-generated invoice note.</small></button></div><div class="actions">'+button("← Back to Entries","signature-back","")+'</div></section></div>';}
function renderPreviewOrDetail(){const invoice=state.mode==="detail"?state.selected:currentDraft();const pages=pagesFor(invoice);const page=state.previewPage;const image=state.images[page];const title=state.mode==="detail"?"Invoice":"Invoice Preview";return '<div class="wrap"><div class="top"><div><h1>'+title+'</h1><p class="sub">'+esc(invoice.invoiceNo)+'</p></div>'+(state.mode==="preview"?button("← Edit Entries","edit-items",""):state.mode==="detail"?'<button type="button" class="btn danger invoice-delete-icon" data-action="delete-invoice" aria-label="Delete Invoice" title="Delete Invoice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>':"")+'</div>'+(state.mode==="preview"?'<div class="row">'+button("Edit Customer","edit-customer","")+' '+button("Edit Language","edit-language","")+'</div>':"")+'<div class="sheet-wrap">'+(image?'<img id="invoicePreview" class="sheet-preview" src="'+image+'" alt="Invoice preview">':'<div class="empty">Preparing A4 preview…</div>')+'</div>'+(pages.length>1?'<div class="preview-page-nav">'+button("←","preview-prev","icon",page===0)+'<span>Page '+(page+1)+" / "+pages.length+'</span>'+button("→","preview-next","icon",page===pages.length-1)+'</div>':"")+(state.mode==="preview"?'<button class="btn primary big" data-action="save-invoice">Save Invoice</button>':'<div class="lang-grid">'+button(state.busy?"Saving…":"Image","save-image","",state.busy)+button(state.busy?"Saving…":"PDF","save-pdf","",state.busy)+button("Share","share","primary",state.busy)+button("← All Invoices","all-invoices","")+'</div>')+'</div>';}
function renderShopModal(){if(!state.shopDraft)return"";const s=state.shopDraft;return '<div class="overlay" data-overlay="shop"><div class="modal"><div class="top"><h3>Invoice Shop Details</h3><button class="btn icon" data-action="close-shop">×</button></div><div class="field"><label>Shop Name</label><input id="shopName" value="'+esc(s.name)+'" placeholder="Shop name"></div><div class="field"><label>Address</label><textarea id="shopAddress" placeholder="Shop address">'+esc(s.address)+'</textarea></div><div class="lang-grid"><div class="field" style="margin:0"><label>Phone 1</label><input id="shopPhone1" value="'+esc(s.phone1)+'" type="tel"></div><div class="field" style="margin:0"><label>Phone 2</label><input id="shopPhone2" value="'+esc(s.phone2)+'" type="tel"></div></div><div class="field"><label>Shop Logo</label><input id="shopLogoFile" type="file" accept="image/*"></div>'+(s.logoDataUrl?'<button class="btn" data-action="reset-logo">Remove logo</button>':"")+'<div class="actions">'+button("Cancel","close-shop","")+'<button class="btn primary" data-action="save-shop">Save Shop Details</button></div></div></div>';}
function renderShareModal(){return state.shareOpen?'<div class="overlay" data-overlay="share"><div class="modal"><h3>Share invoice as</h3><p class="help">Choose a file format to continue to the share menu.</p><div class="share-format-actions">'+button("Image","share-image","primary")+' '+button("PDF","share-pdf","primary")+' '+button("Cancel","close-share","")+'</div></div></div>':"";}
function render(){let content="";if(state.mode==="list")content=renderList();else if(state.mode==="customer")content=renderCustomer();else if(state.mode==="language")content=renderLanguage();else if(state.mode==="items")content=renderItems();else if(state.mode==="signature")content=renderSignature();else if(state.mode==="preview"||state.mode==="detail")content=renderPreviewOrDetail();app.innerHTML=content+renderShopModal()+renderShareModal();bind();if(state.mode==="preview"||state.mode==="detail")prepareInvoiceImages(state.mode==="detail"?state.selected:currentDraft());}
function bind(){app.onclick=async function(e){const target=e.target.closest("[data-action],[data-open],[data-lang],[data-signature],[data-overlay]");if(!target)return;if(target.dataset.overlay&&e.target===target){state.shopDraft=null;state.shareOpen=false;render();return;}if(target.dataset.open!=null){state.selected=state.invoices[Number(target.dataset.open)];state.previewPage=0;state.images=[];setMode("detail");return;}if(target.dataset.lang){state.language=target.dataset.lang;render();return;}if(target.dataset.signature){state.signatureMode=target.dataset.signature;state.previewPage=0;state.images=[];setMode("preview");return;}const action=target.dataset.action;if(!action)return;switch(action){case"new":if(requireShopDetails())startInvoice();break;case"shop":state.shopDraft=Object.assign({},state.shop);render();break;case"close-shop":state.shopDraft=null;render();break;case"save-shop":saveShop();break;case"reset-logo":state.shopDraft.logoDataUrl="";render();break;case"cancel":setMode("list");break;case"customer-next":syncCustomer();if(state.customer.name.trim())setMode("language");else{alert("Enter customer name.");render();}break;case"customer-back":setMode("customer");break;case"language-next":setMode("items");break;case"language-back":setMode("language");break;case"item-prev":syncItem();state.active=Math.max(0,state.active-1);render();break;case"item-next":syncItem();state.active=Math.min(state.items.length-1,state.active+1);render();break;case"item-add":syncItem();state.items.splice(state.active+1,0,{description:"",quantity:"1",rate:""});state.active++;render();break;case"item-finish":syncItem();if(validateItems())setMode("signature");break;case"signature-back":setMode("items");break;case"edit-items":setMode("items");break;case"edit-customer":setMode("customer");break;case"edit-language":setMode("language");break;case"save-invoice":syncCustomer();if(validateItems())saveNewInvoice();break;case"save-image":await exportImages(false);break;case"save-pdf":await exportPdf(false);break;case"share":state.shareOpen=true;render();break;case"share-image":state.shareOpen=false;render();await exportImages(true);break;case"share-pdf":state.shareOpen=false;render();await exportPdf(true);break;case"close-share":state.shareOpen=false;render();break;case"delete-invoice":deleteSelectedInvoice();break;case"all-invoices":state.selected=null;setMode("list");break;case"preview-prev":state.previewPage=Math.max(0,state.previewPage-1);renderPreviewOnly();break;case"preview-next":state.previewPage=Math.min(pagesFor(state.mode==="detail"?state.selected:currentDraft()).length-1,state.previewPage+1);renderPreviewOnly();break;}};app.oninput=function(e){const id=e.target.id;if(id==="custName")state.customer.name=e.target.value;if(id==="custAddress")state.customer.address=e.target.value;if(id==="custPhone")state.customer.phone=e.target.value;if(id==="itemDescription")state.items[state.active].description=e.target.value;if(id==="itemQuantity")state.items[state.active].quantity=e.target.value;if(id==="itemRate")state.items[state.active].rate=e.target.value;if(id==="itemQuantity"||id==="itemRate"){const total=(Number(state.items[state.active].quantity)||0)*(Number(state.items[state.active].rate)||0);const node=document.getElementById("itemTotal");if(node)node.textContent=money(total);}if(id==="shopName")state.shopDraft.name=e.target.value;if(id==="shopAddress")state.shopDraft.address=e.target.value;if(id==="shopPhone1")state.shopDraft.phone1=e.target.value;if(id==="shopPhone2")state.shopDraft.phone2=e.target.value;};app.onchange=function(e){if(e.target.id==="shopLogoFile"){const file=e.target.files&&e.target.files[0];if(!file)return;readShopLogo(file).then(dataUrl=>{state.shopDraft.logoDataUrl=dataUrl;render();}).catch(()=>alert("Could not load shop logo."));}};}
function renderPreviewOnly(){const invoice=state.mode==="detail"?state.selected:currentDraft();const pages=pagesFor(invoice);const page=state.previewPage;const image=state.images[page];const preview=document.querySelector("#invoicePreview");if(preview&&image)preview.src=image;const nav=document.querySelector(".preview-page-nav");if(nav)nav.innerHTML=button("←","preview-prev","icon",page===0)+"<span>Page "+(page+1)+" / "+pages.length+"</span>"+button("→","preview-next","icon",page===pages.length-1);bind();}
function loadLogo(src){return new Promise(resolve=>{const im=new Image();im.onload=function(){resolve(im);};im.onerror=function(){resolve(null);};im.src=src;});}
function readShopLogo(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=function(){const image=new Image();image.onload=function(){const maxSize=1024,scale=Math.min(1,maxSize/image.naturalWidth,maxSize/image.naturalHeight),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext("2d");if(!ctx){resolve(String(reader.result||""));return;}ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/png"));};image.onerror=function(){resolve(String(reader.result||""));};image.src=String(reader.result||"");};reader.onerror=reject;reader.readAsDataURL(file);});}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const words=String(text||"").split(/\s+/);let line="",lines=[];
  function splitLongWord(word){let part="";for(const unit of Array.from(word)){const candidate=part+unit;if(part&&ctx.measureText(candidate).width>maxWidth){lines.push(part);part=unit;}else part=candidate;}return part;}
  for(const word of words){if(!line){line=splitLongWord(word);continue;}const candidate=line+" "+word;if(ctx.measureText(candidate).width<=maxWidth){line=candidate;continue;}lines.push(line);line=splitLongWord(word);}
  if(line)lines.push(line);const limit=maxLines||lines.length;
  if(limit&&lines.length>limit){lines=lines.slice(0,limit);lines[limit-1]=lines[limit-1].replace(/\s+$/,"")+"…";}
  ctx.save();ctx.beginPath();ctx.rect(x,y-lineHeight,maxWidth,lineHeight*(limit+1));ctx.clip();
  lines.forEach((value,index)=>ctx.fillText(value,x,y+index*lineHeight,maxWidth));ctx.restore();return lines.length;
}function drawPage(invoice,pageItems,pageIndex,pageCount,logo){const scale=2,w=794,h=1123,canvas=document.createElement("canvas");canvas.width=w*scale;canvas.height=h*scale;const ctx=canvas.getContext("2d");const rawFillText=ctx.fillText.bind(ctx);ctx.fillText=(value,...args)=>rawFillText(String(value).replace(/\b[a-z]/g,letter=>letter.toUpperCase()),...args);ctx.scale(scale,scale);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);const ink="#000",teal="#147d72",rule="#929b9e";const bn=invoice.language==="bn";const text=bn?{date:"তারিখ :",customer:"গ্রাহকের তথ্য",name:"গ্রাহকের নাম",address:"গ্রাহকের ঠিকানা",phone:"ফোন নম্বর",desc:"বিবরণ",qty:"পরিমাণ",rate:"দর",total:"মোট",grand:"সর্বমোট",signature:"অনুমোদিত স্বাক্ষর"}:{date:"Date :",customer:"Customer Details",name:"Customer Name",address:"Customer Address",phone:"Phone",desc:"Description",qty:"Quantity",rate:"Rate",total:"Total",grand:"Grand Total",signature:"Authorized Signature"};ctx.textAlign="center";ctx.fillStyle=ink;if(logo){const ratio=Math.min(64/logo.width,54/logo.height);ctx.drawImage(logo,(w-logo.width*ratio)/2,26,logo.width*ratio,logo.height*ratio);}ctx.font="bold 21px Arial, sans-serif";ctx.fillText(invoice.shop.name||DEFAULT_SHOP.name,w/2,105);ctx.font="12px Arial, sans-serif";if(invoice.shop.address)ctx.fillText(invoice.shop.address,w/2,128);const phones=[invoice.shop.phone1,invoice.shop.phone2].filter(Boolean).join("  ·  ");if(phones)ctx.fillText(phones,w/2,147);ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(54,164);ctx.lineTo(740,164);ctx.stroke();ctx.font="bold 17px Arial, sans-serif";ctx.fillStyle=ink;ctx.fillText("Invoice",w/2,192);ctx.textAlign="left";ctx.font="bold 12px Arial, sans-serif";ctx.fillText("Invoice No. "+invoice.invoiceNo,54,222);ctx.textAlign="right";ctx.font="bold 12px Arial, sans-serif";ctx.fillText(text.date+" "+dateText(invoice.createdAt,invoice.language),740,222);ctx.strokeStyle=rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(54,238);ctx.lineTo(740,238);ctx.stroke();ctx.textAlign="left";ctx.fillStyle=ink;ctx.font="bold 12px Arial, sans-serif";ctx.fillText(text.customer,54,264);ctx.font="12px Arial, sans-serif";ctx.fillText((bn?text.name+": ":"")+String(invoice.customer.name||""),54,284);ctx.font="12px Arial, sans-serif";const addr=String(invoice.customer.address||"");if(addr){ctx.fillText((bn?text.address+": ":"")+addr,54,303);}if(invoice.customer.phone)ctx.fillText(text.phone+": "+invoice.customer.phone,54,322);const tableX=54,tableY=344,widths=[346,78,125,137],headers=[text.desc,text.qty,text.rate,text.total],headersH=29;let x=tableX;ctx.font="bold 11px Arial, 'Noto Sans Bengali', sans-serif";for(let i=0;i<4;i++){ctx.strokeStyle="#7c8588";ctx.strokeRect(x,tableY,widths[i],headersH);ctx.fillStyle=ink;ctx.textAlign=i===0?"left":"right";ctx.fillText(headers[i],i===0?x+7:x+widths[i]-7,tableY+19);x+=widths[i];}let y=tableY+headersH;ctx.font="11px Arial, 'Noto Sans Bengali', sans-serif";for(const item of pageItems){const maxWidth=widths[0]-14;ctx.textAlign="left";const wordCount=wrapText(ctx,item.description,tableX+7,y+18,maxWidth,14,4);const rowH=Math.max(29,wordCount*14+10);x=tableX;for(let i=0;i<4;i++){ctx.strokeStyle="#a6afb2";ctx.strokeRect(x,y,widths[i],rowH);ctx.fillStyle=ink;if(i===0){ctx.textAlign="left";}else{ctx.textAlign="right";}const val=i===0?"":i===1?String(item.quantity):i===2?money(item.rate):money(Number(item.quantity)*Number(item.rate));if(i>0)ctx.fillText(val,x+widths[i]-7,y+18);x+=widths[i];}y+=rowH;}if(pageIndex===pageCount-1){const total=invoice.items.reduce((sum,item)=>sum+Number(item.quantity)*Number(item.rate),0);y+=9;ctx.strokeStyle=ink;ctx.strokeRect(tableX,y,686,32);ctx.textAlign="right";ctx.fillStyle=ink;ctx.font="bold 12px Arial, 'Noto Sans Bengali', sans-serif";ctx.fillText(text.grand,tableX+686-150,y+21);ctx.font="bold 13px Arial, sans-serif";ctx.fillText(money(total),tableX+686-8,y+21);if(invoice.signatureMode==="manual"){ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(54,1058);ctx.lineTo(289,1058);ctx.stroke();ctx.textAlign="center";ctx.font="12px Arial, 'Noto Sans Bengali', sans-serif";ctx.fillText(text.signature,171.5,1078);}else{ctx.textAlign="center";ctx.font="10px Arial, sans-serif";ctx.fillText("This is a computer-generated invoice and does not require a seal or signature.",w/2,1068);}}if(pageCount>1){ctx.textAlign="right";ctx.font="9px Arial, 'Noto Sans Bengali', sans-serif";ctx.fillStyle=ink;ctx.fillText((bn?"পৃষ্ঠা ":"Page ")+(pageIndex+1)+" / "+pageCount,740,1100);}return canvas.toDataURL("image/jpeg",0.94);}
async function renderInvoiceImages(invoice){const pages=pagesFor(invoice);const logo=invoice.shop.logoDataUrl?await loadLogo(invoice.shop.logoDataUrl):null;return pages.map((page,index)=>drawPage(invoice,page,index,pages.length,logo));}
async function prepareInvoiceImages(invoice){try{state.images=await renderInvoiceImages(invoice);state.imageKey=invoice.id==="draft"?invoice.invoiceNo:invoice.id;const img=document.getElementById("invoicePreview");if(img&&state.images[state.previewPage])img.src=state.images[state.previewPage];if(state.mode==="preview"||state.mode==="detail"){const node=document.querySelector(".sheet-wrap");if(node&&!img){node.innerHTML='<img id="invoicePreview" class="sheet-preview" alt="Invoice preview">';node.firstChild.src=state.images[state.previewPage]||"";}}}catch(e){console.error("Invoice preview error",e);}}
async function getImages(){const invoice=state.mode==="detail"?state.selected:currentDraft();const key=invoice.id==="draft"?invoice.invoiceNo:invoice.id;if(state.imageKey===key&&state.images.length)return state.images;return renderInvoiceImages(invoice);}
function safeBase(invoice){const customer=String(invoice.customer&&invoice.customer.name||"Customer").trim().replace(/[\/\\:*?"<>|\u0000-\u001f]/g," ").replace(/\s+/g," ").replace(/[. ]+$/g,"")||"Customer";const date=new Date(Number(invoice.createdAt)||Date.now());const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];const generatedDate=String(date.getDate()).padStart(2,"0")+" "+monthNames[date.getMonth()]+" "+date.getFullYear();return customer+" "+generatedDate;}
function saveImageDownloads(pages,base,shopName){if(window.AndroidBridge&&typeof AndroidBridge.saveInvoiceImages==="function"){if(!AndroidBridge.saveInvoiceImages(JSON.stringify(pages),base+".jpg",shopName||""))throw new Error("Could not save invoice image to Downloads.");return;}pages.forEach(function(data){const a=document.createElement("a");a.href=data;a.download=base+".jpg";a.click();});toast("Invoice Image Saved To Download Folder");}
async function exportImages(share){state.busy=true;renderPreviewOnly();try{const invoice=state.selected,pages=await getImages(),base=safeBase(invoice),shopName=invoice.shop&&invoice.shop.name||"";if(share&&window.AndroidBridge&&typeof AndroidBridge.shareInvoiceImages==="function"){if(!AndroidBridge.shareInvoiceImages(JSON.stringify(pages),base+".jpg",shopName))throw new Error("Could not prepare invoice images to share.");}else if(share&&navigator.share&&navigator.canShare){const files=[];for(let i=0;i<pages.length;i++){const blob=await(await fetch(pages[i])).blob();files.push(new File([blob],base+".jpg",{type:"image/jpeg"}));}if(navigator.canShare({files}))await navigator.share({files,title:invoice.invoiceNo});else saveImageDownloads(pages,base,shopName);}else saveImageDownloads(pages,base,shopName);}catch(e){if(e.name!=="AbortError")alert(e.message||"Image export failed.");}finally{state.busy=false;render();}}
async function exportPdf(share){state.busy=true;renderPreviewOnly();let waitForWindowsSave=false;try{const invoice=state.selected,pages=await getImages(),base=safeBase(invoice),shopName=invoice.shop&&invoice.shop.name||"",bridge=window.AndroidBridge;if(share&&bridge&&typeof bridge.shareInvoicePdf==="function"){if(!bridge.shareInvoicePdf(JSON.stringify(pages),base+".pdf",shopName))throw new Error("Could not prepare invoice PDF to share.");}else if(!share&&bridge&&typeof bridge.saveInvoicePdf==="function"){const result=bridge.saveInvoicePdf(JSON.stringify(pages),base+".pdf",shopName);if(result===false)throw new Error("Could not save invoice PDF to Downloads.");if(result==="pending")waitForWindowsSave=true;else if(typeof AndroidBridge.showToast!=="function")toast("Invoice PDF Saved To Download Folder");}else window.print();}catch(e){alert(e.message||"PDF export failed.");}finally{if(!waitForWindowsSave){state.busy=false;render();}}}
window.onWindowsInvoicePdfSaved=function(payload){let result;try{result=typeof payload==="string"?JSON.parse(payload):payload;}catch(e){result=null;}state.busy=false;render();if(result&&result.success)showInvoicePageToast("Invoice PDF Saved To Download Folder");else alert(result&&result.message||"Could not save invoice PDF to Downloads.");};
window.onWindowsInvoiceImagesSaved=function(payload){let result;try{result=typeof payload==="string"?JSON.parse(payload):payload;}catch(e){result=null;}if(result&&result.success)showInvoicePageToast("Invoice Image Saved To Download Folder");else alert(result&&result.message||"Could not save invoice image to Downloads.");};
function syncCustomer(){const n=document.getElementById("custName"),a=document.getElementById("custAddress"),p=document.getElementById("custPhone");if(n)state.customer.name=n.value;if(a)state.customer.address=a.value;if(p)state.customer.phone=p.value;}
function syncItem(){const d=document.getElementById("itemDescription"),q=document.getElementById("itemQuantity"),r=document.getElementById("itemRate");if(d)state.items[state.active].description=d.value;if(q)state.items[state.active].quantity=q.value;if(r)state.items[state.active].rate=r.value;}
function validateItems(){for(const item of state.items){if(!String(item.description||"").trim()){alert(labels().descriptionRequired);return false;}if(!(Number(item.quantity)>0)){alert(labels().quantityRequired);return false;}if(String(item.rate==null?"":item.rate).trim()===""||!Number.isFinite(Number(item.rate))||Number(item.rate)<0){alert(labels().rateRequired);return false;}}return true;}
function saveShop(){syncShopDraft();if(!String(state.shopDraft.name||"").trim()||!String(state.shopDraft.address||"").trim()||(!String(state.shopDraft.phone1||"").trim()&&!String(state.shopDraft.phone2||"").trim())){alert("Enter shop name, address, and at least one phone number.");return;}state.shop=Object.assign({},DEFAULT_SHOP,state.shopDraft);try{writeStored(STORAGE_SHOP,state.shop);state.shopDraft=null;render();toast("Shop details saved.");}catch(e){alert("Could not save shop details.");}}
function syncShopDraft(){const n=document.getElementById("shopName"),a=document.getElementById("shopAddress"),p1=document.getElementById("shopPhone1"),p2=document.getElementById("shopPhone2");if(n)state.shopDraft.name=n.value;if(a)state.shopDraft.address=a.value;if(p1)state.shopDraft.phone1=p1.value;if(p2)state.shopDraft.phone2=p2.value;}
function saveNewInvoice(){if(!requireShopDetails())return;const total=state.items.reduce((sum,item)=>sum+Number(item.quantity)*Number(item.rate),0);const record={id:"invoice-"+Date.now(),invoiceNo:state.invoiceNo,createdAt:Date.now(),shop:Object.assign({},state.shop),customer:Object.assign({},state.customer),language:state.language,signatureMode:state.signatureMode,items:state.items.map(x=>({description:String(x.description).trim(),quantity:Number(x.quantity),rate:Number(x.rate)})),total:Math.round(total*100)/100};state.invoices.unshift(record);try{writeStored(STORAGE_INVOICES,state.invoices);state.selected=record;state.images=[];state.previewPage=0;setMode("detail");toast("Invoice generated.");}catch(e){state.invoices.shift();alert("Could not save invoice.");}}
function deleteSelectedInvoice(){
  const invoice=state.selected;
  if(!invoice)return;
  const customerName=String(invoice.customer&&invoice.customer.name||"Customer").trim()||"Customer";
  if(!window.confirm("Delete the invoice for "+customerName+"?"))return;
  const previousInvoices=state.invoices;
  state.invoices=state.invoices.filter(item=>String(item.id)!==String(invoice.id));
  try{
    writeStored(STORAGE_INVOICES,state.invoices);
    state.selected=null;
    state.images=[];
    state.imageKey="";
    state.previewPage=0;
    setMode("list");
    toast("Invoice deleted.");
  }catch(e){
    state.invoices=previousInvoices;
    alert("Could not delete invoice.");
  }
}
function setMode(mode){state.mode=mode;render();}
window.handleInvoiceAndroidBack=function(){
  if(state.shareOpen){state.shareOpen=false;render();return "handled";}
  if(state.shopDraft){state.shopDraft=null;render();return "handled";}
  const previous={customer:"list",language:"customer",items:"language",signature:"items",preview:"signature",detail:"list",list:"list"}[state.mode]||"list";
  if(previous!==state.mode)setMode(previous);
  return "handled";
};
try{if(localStorage.getItem("invoice_open_shop_details")==="true"){localStorage.removeItem("invoice_open_shop_details");state.shopDraft=Object.assign({},state.shop);}}catch(e){}
render();
})();
